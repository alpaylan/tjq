[package]
name = "tjq_testing"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[[bin]]
name = "difftest"
path = "difftest.rs"

[dependencies]
tjq_exec = { path = "../tjq_exec" }
tjq_semantics = { path = "../tjq_semantics" }
# float_roundtrip: the differential oracle parses jq's number output; the
# default fast float path is lossy by up to 1 ULP and fabricates
# divergences
serde_json = { version = "1.0.139", features = ["float_roundtrip"] }
